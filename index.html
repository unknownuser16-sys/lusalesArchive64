<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lusales Archive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function() {
            const saved = localStorage.getItem('lusales_theme') || 'black';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="logo">
            <h1 onclick="window.scrollTo({top:0,behavior:'smooth'})">
                <i class="fas fa-book"></i> lusaleArchive
            </h1>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="library.html">Library</a>
            <a href="#recent">Recent</a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search books...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <div id="themeSwitcherMount"></div>
            <div class="user-menu" id="userMenu">
                <button class="auth-btn" id="authBtn">
                    <i class="fab fa-google"></i> Sign in
                </button>
                <div class="user-dropdown" id="userDropdown">
                    <a href="dashboard.html" id="dashboardLink" style="display:none"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                    <button class="signout-btn" id="signoutBtn"><i class="fas fa-sign-out-alt"></i> Sign out</button>
                </div>
            </div>
        </div>
        <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
    </div>
</nav>

<main class="container">
    <section class="hero" id="home">
        <div class="hero-content">
            <h2>Welcome to the Archive</h2>
            <p>A collection of original stories and chapters, updated regularly.</p>
            <div class="hero-divider">— ✦ —</div>
        </div>
    </section>

    <section class="recent-chapters" id="recent">
        <div class="section-header">
            <h2><i class="fas fa-clock"></i> Recent Updates</h2>
        </div>
        <div class="chapters-list" id="recentChapters"></div>
    </section>
</main>

<footer>
    <div class="container">
        <p>&copy; 2025 Lusales Archive · All rights reserved.</p>
        <div class="footer-links">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Contact</a>
        </div>
    </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
<script src="theme.js"></script>
<script src="main.js"></script>

<script>
    // Hamburger menu toggle (ensures it works)
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const navLinks = document.getElementById('navLinks');
    if (mobileBtn && navLinks) {
        mobileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            navLinks.classList.toggle('open');
        });
        // Close when clicking outside
        document.addEventListener('click', (event) => {
            if (!navLinks.contains(event.target) && !mobileBtn.contains(event.target)) {
                navLinks.classList.remove('open');
            }
        });
    }
</script>
</body>
</html>
