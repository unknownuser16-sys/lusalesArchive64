<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading — Lusales Archive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>(function(){const t=localStorage.getItem('lusales_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <style>
        :root {
            --bg:          #000000;
            --bg-card:     #0a0a0a;
            --bg-hover:    #111111;
            --border:      #222222;
            --accent:      #ffffff;
            --accent-dim:  #888888;
            --accent-glow: rgba(255,255,255,0.06);
            --text:        #ffffff;
            --text-muted:  #888888;
            --text-dim:    #444444;
            --nav-bg:      rgba(0,0,0,0.96);
            --shadow:      0 8px 32px rgba(0,0,0,0.8);
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body:    'Lora', 'Crimson Text', Georgia, serif;
            --font-ui:      'Calibri', 'Segoe UI', system-ui, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 1.15rem;
            line-height: 1.9;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* ── TOP BAR ── */
        .reader-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            height: 52px;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem; gap: 1rem;
            transition: opacity 0.35s, transform 0.35s, background 0.3s;
        }

        .reader-bar.hidden { opacity: 0; transform: translateY(-100%); pointer-events: none; }

        .bar-left { display: flex; align-items: center; gap: 0.75rem; flex: 1; min-width: 0; }

        .back-btn {
            background: none; border: 1px solid var(--border); color: var(--text-muted);
            padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer;
            font-family: var(--font-ui); font-size: 0.78rem;
            display: flex; align-items: center; gap: 0.4rem;
            transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
        }
        .back-btn:hover { border-color: var(--accent-dim); color: var(--text); }

        .bar-title {
            font-family: var(--font-display); font-size: 0.88rem;
            color: var(--text-muted); white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .bar-title span { color: var(--text); }

        .bar-right { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }

        .bar-btn {
            background: none; border: 1px solid var(--border); color: var(--text-muted);
            padding: 0.3rem 0.55rem; border-radius: 4px; cursor: pointer;
            font-size: 0.78rem; transition: all 0.2s; font-family: var(--font-ui);
        }
        .bar-btn:hover { border-color: var(--accent-dim); color: var(--text); }
        .bar-btn.active { border-color: var(--accent-dim); color: var(--text); background: var(--accent-glow); }

        /* Reading mode toggle — surprise tweak */
        .reading-mode-btn {
            background: none; border: 1px solid var(--border); color: var(--text-muted);
            padding: 0.3rem 0.55rem; border-radius: 4px; cursor: pointer;
            font-size: 0.78rem; transition: all 0.2s;
        }
        .reading-mode-btn:hover { border-color: var(--accent-dim); color: var(--text); }
        .reading-mode-btn.active { background: var(--accent-glow); border-color: var(--accent-dim); color: var(--text); }

        /* Auth in bar */
        .bar-auth-btn {
            background: none; border: 1px solid var(--border); color: var(--text-muted);
            padding: 0.3rem 0.7rem; border-radius: 4px; cursor: pointer;
            font-family: var(--font-ui); font-size: 0.75rem;
            display: flex; align-items: center; gap: 0.4rem;
            transition: all 0.2s; white-space: nowrap;
        }
        .bar-auth-btn:hover { border-color: var(--accent-dim); color: var(--text); }
        .bar-auth-btn img { width: 16px; height: 16px; border-radius: 50%; }

        /* Theme panel in reader */
        .theme-switcher { position: relative; }
        .theme-toggle-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 0.3rem 0.55rem; border-radius: 4px; cursor: pointer; font-size: 0.82rem; display: flex; align-items: center; transition: all 0.2s; }
        .theme-toggle-btn:hover { border-color: var(--accent-dim); color: var(--text); }
        .theme-panel { display: none; position: absolute; top: calc(100% + 8px); right: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; min-width: 165px; box-shadow: var(--shadow); z-index: 300; overflow: hidden; }
        .theme-panel.open { display: block; }
        .theme-panel-header { padding: 0.5rem 1rem; font-family: var(--font-ui); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border); }
        .theme-options { padding: 0.3rem; display: flex; flex-direction: column; gap: 0.1rem; }
        .theme-option { display: flex; align-items: center; gap: 0.65rem; padding: 0.52rem 0.7rem; background: none; border: 1px solid transparent; border-radius: 4px; cursor: pointer; color: var(--text-muted); font-family: var(--font-ui); font-size: 0.82rem; width: 100%; text-align: left; transition: all 0.2s; }
        .theme-option:hover { background: var(--bg-hover); color: var(--text); }
        .theme-option.active { border-color: var(--accent-dim); color: var(--text); background: var(--accent-glow); }
        .theme-icon { font-size: 0.9rem; }
        .custom-theme-editor { padding: 0.7rem; border-top: 1px solid var(--border); display: none; flex-direction: column; gap: 0.45rem; }
        .custom-theme-editor.visible { display: flex; }
        .color-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
        .color-row label { font-family: var(--font-ui); font-size: 0.75rem; color: var(--text-muted); }
        .color-row input[type="color"] { width: 32px; height: 22px; border: 1px solid var(--border); border-radius: 3px; cursor: pointer; background: none; padding: 1px; }
        .apply-custom-btn { background: var(--accent); color: var(--bg); border: none; padding: 0.42rem; border-radius: 4px; cursor: pointer; font-family: var(--font-ui); font-size: 0.75rem; font-weight: 600; transition: opacity 0.2s; }
        .apply-custom-btn:hover { opacity: 0.82; }

        /* ── PROGRESS BAR ── */
        .progress-bar {
            position: fixed; top: 52px; left: 0;
            height: 2px; background: var(--accent-dim);
            width: 0%; z-index: 99; transition: width 0.1s;
        }

        /* ── FOCUS MODE (surprise tweak) ── */
        body.focus-mode .reader-bar { opacity: 0; pointer-events: none; }
        body.focus-mode .reader-bar:hover { opacity: 1; pointer-events: all; }
        body.focus-mode .progress-bar { opacity: 0; }

        /* ── READER PAGE ── */
        .reader-page {
            max-width: 660px;
            margin: 0 auto;
            padding: 90px 2rem 80px;
        }

        /* ── CHAPTER HEADER ── */
        .chapter-header {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        .book-label {
            font-family: var(--font-ui);
            font-size: 0.72rem; letter-spacing: 0.18em;
            text-transform: uppercase; color: var(--text-dim);
            margin-bottom: 0.75rem; display: block;
        }

        .chapter-header h1 {
            font-family: var(--font-display);
            font-size: clamp(1.7rem, 4vw, 2.6rem);
            font-weight: 700; color: var(--text);
            line-height: 1.2; margin-bottom: 0.75rem;
        }

        .chapter-meta {
            font-family: var(--font-ui);
            font-size: 0.78rem; color: var(--text-dim);
            display: flex; align-items: center; gap: 1rem;
            flex-wrap: wrap;
        }

        .chapter-meta-item { display: flex; align-items: center; gap: 0.35rem; }

        /* ── CHAPTER BODY ── */
        .chapter-body { position: relative; }

        .chapter-body p {
            margin-bottom: 1.6em;
            text-indent: 2em;
            color: var(--text);
        }

        .chapter-body p:first-child { text-indent: 0; }

        /* Drop cap — surprise tweak */
        .chapter-body p:first-child::first-letter {
            font-family: var(--font-display);
            font-size: 4.2em;
            font-weight: 700;
            color: var(--text);
            float: left;
            line-height: 0.72;
            margin-right: 0.07em;
            margin-top: 0.1em;
        }

        /* ── DIVIDER ── */
        .chapter-divider {
            color: var(--text-dim);
            font-family: var(--font-display);
            letter-spacing: 0.5em;
            font-size: 0.82rem;
            text-align: center;
            margin: 3.5rem 0;
        }

        /* ── CHAPTER NAV ── */
        .chapter-nav {
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 3.5rem;
        }

        .nav-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.8rem 1.25rem;
            border-radius: 6px; cursor: pointer;
            font-family: var(--font-ui); font-size: 0.78rem;
            display: flex; align-items: center; gap: 0.6rem;
            transition: all 0.2s; max-width: 46%;
        }

        .nav-btn:hover { border-color: var(--accent-dim); color: var(--text); background: var(--bg-hover); }
        .nav-btn.disabled { opacity: 0.22; cursor: not-allowed; pointer-events: none; }
        .nav-btn-inner { display: flex; flex-direction: column; gap: 0.1rem; }
        .nav-label { font-size: 0.62rem; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
        .nav-title { font-size: 0.8rem; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }

        /* ── INTERACTION SECTION (ratings + comments together) ── */
        .interaction-section {
            border-top: 1px solid var(--border);
            padding-top: 2.5rem;
        }

        .interaction-section-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 1.75rem;
            display: flex; align-items: center; gap: 0.5rem;
        }

        .interaction-section-title i { color: var(--accent-dim); font-size: 0.95rem; }

        /* Rating block */
        .rating-block {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .rating-block-left h4 {
            font-family: var(--font-ui);
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 0.6rem;
        }

        .stars { display: flex; gap: 0.35rem; }

        .star {
            font-size: 1.5rem;
            color: var(--text-dim);
            cursor: pointer;
            transition: color 0.15s, transform 0.15s;
        }

        .star:hover, .star.filled { color: var(--text); }
        .star:hover { transform: scale(1.18); }

        .rating-block-right {
            text-align: right;
        }

        .rating-avg {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--text);
            line-height: 1;
        }

        .rating-count {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 0.2rem;
        }

        /* ── COMMENTS ── */
        .comments-header {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .comments-header h4 {
            font-family: var(--font-ui);
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .comments-count {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .comment-form { margin-bottom: 1.75rem; }

        .comment-form textarea {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.9rem 1rem;
            border-radius: 6px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            line-height: 1.65;
            resize: vertical;
            min-height: 95px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .comment-form textarea:focus { border-color: var(--accent-dim); }
        .comment-form textarea::placeholder { color: var(--text-dim); }

        .comment-form-footer {
            display: flex; justify-content: space-between;
            align-items: center; margin-top: 0.65rem; gap: 1rem;
        }

        .comment-user-info {
            display: flex; align-items: center; gap: 0.55rem;
            font-family: var(--font-ui); font-size: 0.78rem; color: var(--text-muted);
        }

        .comment-user-info img { width: 20px; height: 20px; border-radius: 50%; }

        .submit-comment-btn {
            background: var(--text); color: var(--bg);
            border: none; padding: 0.52rem 1.1rem;
            border-radius: 4px; cursor: pointer;
            font-family: var(--font-ui); font-size: 0.78rem;
            font-weight: 600; transition: opacity 0.2s; white-space: nowrap;
        }

        .submit-comment-btn:hover { opacity: 0.82; }
        .submit-comment-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .comment-login-prompt {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px; padding: 1.25rem;
            text-align: center; margin-bottom: 1.75rem;
        }

        .comment-login-prompt p {
            font-family: var(--font-ui); font-size: 0.85rem;
            color: var(--text-muted); margin-bottom: 0.65rem;
        }

        .comment-login-prompt button {
            background: none; border: 1px solid var(--border);
            color: var(--text-muted); padding: 0.45rem 1.1rem;
            border-radius: 4px; cursor: pointer;
            font-family: var(--font-ui); font-size: 0.78rem;
            transition: all 0.2s;
        }

        .comment-login-prompt button:hover { border-color: var(--accent-dim); color: var(--text); }

        .comments-list { display: flex; flex-direction: column; gap: 1rem; }

        .comment-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px; padding: 1.1rem 1.25rem;
        }

        .comment-header {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-bottom: 0.65rem; gap: 1rem;
        }

        .comment-author { display: flex; align-items: center; gap: 0.55rem; }

        .comment-author img {
            width: 26px; height: 26px;
            border-radius: 50%; border: 1px solid var(--border);
        }

        .comment-author-info { display: flex; flex-direction: column; gap: 0.05rem; }
        .comment-name { font-family: var(--font-ui); font-size: 0.82rem; color: var(--text); }
        .comment-date { font-family: var(--font-ui); font-size: 0.7rem; color: var(--text-dim); }

        .comment-delete-btn {
            background: none; border: none; color: var(--text-dim);
            cursor: pointer; font-size: 0.78rem; padding: 0.2rem 0.35rem;
            border-radius: 3px; transition: color 0.2s; flex-shrink: 0;
        }

        .comment-delete-btn:hover { color: #e74c3c; }
        .comment-text { font-size: 0.95rem; line-height: 1.65; color: var(--text); }

        .comments-empty {
            text-align: center; padding: 2rem;
            color: var(--text-dim); font-family: var(--font-ui);
            font-size: 0.82rem; letter-spacing: 0.04em;
            border: 1px dashed var(--border); border-radius: 6px;
        }

        .comments-loading {
            text-align: center; padding: 1.5rem;
            color: var(--text-dim); font-family: var(--font-ui); font-size: 0.8rem;
        }

        /* ── TOAST ── */
        .toast {
            position: fixed; bottom: 2rem; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text); padding: 0.65rem 1.4rem;
            border-radius: 6px; font-family: var(--font-ui); font-size: 0.82rem;
            z-index: 500; transition: transform 0.3s; white-space: nowrap;
            box-shadow: var(--shadow);
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ── LOADING / ERROR ── */
        .loading-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            z-index: 999; transition: opacity 0.5s;
        }

        .loading-screen.fade-out { opacity: 0; pointer-events: none; }
        .loading-inner { text-align: center; }
        .loading-inner i { font-size: 2rem; color: var(--accent-dim); animation: spin 1.5s linear infinite; display: block; margin-bottom: 1rem; }
        .loading-inner p { font-family: var(--font-ui); font-size: 0.8rem; color: var(--text-muted); letter-spacing: 0.08em; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-screen { display: none; text-align: center; padding: 6rem 2rem; }
        .error-screen i { font-size: 2.5rem; color: var(--text-dim); display: block; margin-bottom: 1.5rem; }
        .error-screen h2 { font-family: var(--font-display); font-size: 1.7rem; margin-bottom: 0.75rem; color: var(--text); }
        .error-screen p { color: var(--text-muted); font-family: var(--font-ui); margin-bottom: 2rem; }
        .error-screen a { font-family: var(--font-ui); font-size: 0.82rem; color: var(--text-muted); border: 1px solid var(--border); padding: 0.55rem 1.4rem; border-radius: 4px; text-decoration: none; transition: all 0.2s; }
        .error-screen a:hover { border-color: var(--accent-dim); color: var(--text); }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            .reader-page { padding: 80px 1.25rem 60px; }
            .reader-bar { padding: 0 1rem; }
            .bar-title { display: none; }
            .nav-title { max-width: 100px; }
            .rating-block { flex-direction: column; align-items: flex-start; }
            .rating-block-right { text-align: left; }
        }
    </style>
</head>
<body>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen">
    <div class="loading-inner">
        <i class="fas fa-book-open"></i>
        <p>Opening chapter...</p>
    </div>
</div>

<!-- Top bar -->
<div class="reader-bar" id="readerBar">
    <div class="bar-left">
        <button class="back-btn" onclick="goBack()">
            <i class="fas fa-arrow-left"></i> Back
        </button>
        <span class="bar-title" id="barTitle">Loading...</span>
    </div>
    <div class="bar-right">
        <button class="bar-btn" id="bookmarkBtn" onclick="toggleBookmark()" title="Bookmark">
            <i class="far fa-bookmark"></i>
        </button>
        <button class="bar-btn" onclick="changeFontSize(-1)" title="Smaller text">A-</button>
        <button class="bar-btn" onclick="changeFontSize(1)" title="Larger text">A+</button>
        <button class="reading-mode-btn" id="readingModeBtn" onclick="toggleReadingMode()" title="Focus mode">
            <i class="fas fa-eye"></i>
        </button>
        <div id="readerThemeMount"></div>
        <button class="bar-auth-btn" id="barAuthBtn" onclick="handleBarAuth()">
            <i class="fab fa-google"></i> Sign in
        </button>
    </div>
</div>

<!-- Progress bar -->
<div class="progress-bar" id="progressBar"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Reader page -->
<div class="reader-page" id="readerPage" style="display:none">

    <!-- Chapter header -->
    <div class="chapter-header">
        <span class="book-label" id="bookLabel">— book —</span>
        <h1 id="chapterTitle">Chapter Title</h1>
        <div class="chapter-meta">
            <span class="chapter-meta-item"><i class="far fa-calendar" style="font-size:0.7rem"></i> <span id="chapterDate">—</span></span>
            <span class="chapter-meta-item" id="readTimeItem"><i class="far fa-clock" style="font-size:0.7rem"></i> <span id="readTime">—</span></span>
        </div>
    </div>

    <!-- Chapter body -->
    <div class="chapter-body" id="chapterBody"></div>

    <div class="chapter-divider">— ✦ —</div>

    <!-- Chapter nav -->
    <div class="chapter-nav">
        <button class="nav-btn disabled" id="prevBtn" onclick="navigateChapter(-1)">
            <i class="fas fa-chevron-left"></i>
            <div class="nav-btn-inner">
                <span class="nav-label">Previous</span>
                <span class="nav-title" id="prevTitle">—</span>
            </div>
        </button>
        <button class="nav-btn disabled" id="nextBtn" onclick="navigateChapter(1)">
            <div class="nav-btn-inner" style="text-align:right">
                <span class="nav-label">Next</span>
                <span class="nav-title" id="nextTitle">—</span>
            </div>
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <!-- ── INTERACTION SECTION — ratings + comments together ── -->
    <div class="interaction-section">
        <div class="interaction-section-title">
            <i class="fas fa-star"></i> Rate &amp; Comment
        </div>

        <!-- Rating block -->
        <div class="rating-block">
            <div class="rating-block-left">
                <h4>Rate this book</h4>
                <div class="stars" id="starsContainer">
                    <i class="far fa-star star" data-value="1"></i>
                    <i class="far fa-star star" data-value="2"></i>
                    <i class="far fa-star star" data-value="3"></i>
                    <i class="far fa-star star" data-value="4"></i>
                    <i class="far fa-star star" data-value="5"></i>
                </div>
            </div>
            <div class="rating-block-right">
                <div class="rating-avg" id="ratingAvg">—</div>
                <div class="rating-count" id="ratingCount">No ratings yet</div>
            </div>
        </div>

        <!-- Comments -->
        <div class="comments-header">
            <h4>Comments</h4>
            <span class="comments-count" id="commentsCount"></span>
        </div>

        <div id="commentFormArea"></div>

        <div class="comments-list" id="commentsList">
            <div class="comments-loading">Loading comments...</div>
        </div>
    </div>

</div>

<!-- Error -->
<div class="error-screen" id="errorScreen">
    <i class="fas fa-book"></i>
    <h2>Chapter not found</h2>
    <p>This chapter doesn't exist or may have been removed.</p>
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Archive</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
<script src="firebase.js"></script>
<script src="theme.js"></script>
<script>
    const db       = firebase.firestore();
    const auth     = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    let currentChapter  = null;
    let currentBook     = null;
    let allBookChapters = [];
    let currentIndex    = 0;
    let fontSize        = 1.15;
    let currentUser     = null;
    let isBookmarked    = false;
    let userRating      = 0;
    let focusMode       = false;

    // ── INIT ──────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
        loadSavedTheme();
        buildThemeSwitcher('readerThemeMount');

        const params    = new URLSearchParams(window.location.search);
        const chapterId = params.get('chapter');
        if (!chapterId) { showError(); return; }

        auth.onAuthStateChanged(async user => {
            currentUser = user;
            updateBarAuth(user);
            updateCommentForm();
            if (currentChapter) {
                await loadUserData();
                updateBookmarkBtn();
                loadRatings();
            }
        });

        try {
            const chapDoc = await db.collection('chapters').doc(chapterId).get();
            if (!chapDoc.exists) { showError(); return; }
            currentChapter = { id: chapDoc.id, ...chapDoc.data() };

            const bookDoc = await db.collection('books').doc(currentChapter.bookId).get();
            currentBook   = bookDoc.exists ? { id: bookDoc.id, ...bookDoc.data() } : null;

            const chapSnap = await db.collection('chapters')
                .where('bookId', '==', currentChapter.bookId).get();
            allBookChapters = chapSnap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .sort((a,b) => new Date(a.date) - new Date(b.date));
            currentIndex = allBookChapters.findIndex(c => c.id === chapterId);

            renderChapter(currentChapter, currentBook);
            setupProgressBar();
            setupBarAutoHide();
            setupStars();
            loadRatings();
            loadComments();
            fadeOutLoader();

        } catch (err) {
            console.error(err);
            showError();
        }
    });

    // ── AUTH ──────────────────────────────────────────────
    function updateBarAuth(user) {
        const btn = document.getElementById('barAuthBtn');
        if (!btn) return;
        if (user) {
            btn.innerHTML = user.photoURL
                ? `<img src="${user.photoURL}" alt=""> ${user.displayName ? user.displayName.split(' ')[0] : 'Me'}`
                : `<i class="fas fa-user-circle"></i> ${user.displayName ? user.displayName.split(' ')[0] : 'Me'}`;
        } else {
            btn.innerHTML = '<i class="fab fa-google"></i> Sign in';
        }
    }

    function handleBarAuth() {
        if (currentUser) {
            if (confirm('Sign out?')) auth.signOut();
        } else {
            auth.signInWithPopup(provider).catch(() => showToast('Sign in failed. Try again.'));
        }
    }

    // ── FOCUS MODE (surprise tweak) ────────────────────────
    function toggleReadingMode() {
        focusMode = !focusMode;
        document.body.classList.toggle('focus-mode', focusMode);
        const btn = document.getElementById('readingModeBtn');
        if (btn) btn.classList.toggle('active', focusMode);
        showToast(focusMode ? 'Focus mode on — hover top to show bar' : 'Focus mode off');
    }

    // ── BOOKMARK ──────────────────────────────────────────
    async function loadUserData() {
        if (!currentUser || !currentChapter) return;
        try {
            const bDoc = await db.collection('bookmarks')
                .doc(`${currentUser.uid}_${currentChapter.bookId}`).get();
            isBookmarked = bDoc.exists;

            const rDoc = await db.collection('ratings')
                .doc(`${currentUser.uid}_${currentChapter.bookId}`).get();
            userRating = rDoc.exists ? rDoc.data().rating : 0;
            renderStars(userRating);
        } catch (err) { console.error(err); }
    }

    function updateBookmarkBtn() {
        const btn  = document.getElementById('bookmarkBtn');
        if (!btn) return;
        const icon = btn.querySelector('i');
        if (isBookmarked) { icon.className = 'fas fa-bookmark'; btn.classList.add('active'); }
        else              { icon.className = 'far fa-bookmark'; btn.classList.remove('active'); }
    }

    async function toggleBookmark() {
        if (!currentUser) { showToast('Sign in to bookmark'); return; }
        const ref = db.collection('bookmarks').doc(`${currentUser.uid}_${currentChapter.bookId}`);
        try {
            if (isBookmarked) {
                await ref.delete(); isBookmarked = false; showToast('Bookmark removed');
            } else {
                await ref.set({ userId: currentUser.uid, bookId: currentChapter.bookId, chapterId: currentChapter.id, bookTitle: currentBook?.title || '', savedAt: new Date().toISOString() });
                isBookmarked = true; showToast('Bookmarked!');
            }
            updateBookmarkBtn();
        } catch (err) { showToast('Error saving bookmark'); }
    }

    // ── RATINGS ───────────────────────────────────────────
    function setupStars() {
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('mouseover', () => hoverStars(parseInt(star.dataset.value)));
            star.addEventListener('mouseout',  () => renderStars(userRating));
            star.addEventListener('click',     () => submitRating(parseInt(star.dataset.value)));
        });
    }

    function hoverStars(value) {
        document.querySelectorAll('.star').forEach(s => {
            s.className = parseInt(s.dataset.value) <= value ? 'fas fa-star star filled' : 'far fa-star star';
        });
    }

    function renderStars(value) {
        document.querySelectorAll('.star').forEach(s => {
            s.className = parseInt(s.dataset.value) <= value ? 'fas fa-star star filled' : 'far fa-star star';
        });
    }

    async function loadRatings() {
        if (!currentBook) return;
        try {
            const snap = await db.collection('ratings').where('bookId', '==', currentBook.id).get();
            const avg  = document.getElementById('ratingAvg');
            const cnt  = document.getElementById('ratingCount');

            if (snap.empty) {
                if (avg) avg.textContent = '—';
                if (cnt) cnt.textContent = 'No ratings yet';
                return;
            }

            const ratings = snap.docs.map(d => d.data().rating);
            const average = (ratings.reduce((a,b) => a+b,0) / ratings.length).toFixed(1);
            if (avg) avg.textContent = `${average} / 5`;
            if (cnt) cnt.textContent = `${ratings.length} rating${ratings.length !== 1 ? 's' : ''}`;

            if (currentUser && userRating > 0) renderStars(userRating);
        } catch (err) { console.error(err); }
    }

    async function submitRating(value) {
        if (!currentUser) { showToast('Sign in to rate this book'); renderStars(userRating); return; }
        if (!currentBook) return;
        try {
            await db.collection('ratings').doc(`${currentUser.uid}_${currentBook.id}`).set({
                userId: currentUser.uid, bookId: currentBook.id,
                rating: value, ratedAt: new Date().toISOString()
            });
            userRating = value; renderStars(userRating);
            showToast(`Rated ${value} star${value !== 1 ? 's' : ''}!`);
            loadRatings();
        } catch (err) { showToast('Error saving rating'); }
    }

    // ── COMMENTS ──────────────────────────────────────────
    function updateCommentForm() {
        const area = document.getElementById('commentFormArea');
        if (!area) return;

        if (currentUser) {
            area.innerHTML = `
                <div class="comment-form">
                    <textarea id="commentInput" placeholder="Share your thoughts..."></textarea>
                    <div class="comment-form-footer">
                        <div class="comment-user-info">
                            ${currentUser.photoURL ? `<img src="${escHtml(currentUser.photoURL)}" alt="">` : '<i class="fas fa-user-circle"></i>'}
                            ${escHtml(currentUser.displayName || 'Anonymous')}
                        </div>
                        <button class="submit-comment-btn" onclick="submitComment()">
                            <i class="fas fa-paper-plane"></i> Post
                        </button>
                    </div>
                </div>`;
        } else {
            area.innerHTML = `
                <div class="comment-login-prompt">
                    <p>Sign in to leave a comment</p>
                    <button onclick="handleBarAuth()"><i class="fab fa-google"></i> Sign in with Google</button>
                </div>`;
        }
    }

    async function loadComments() {
        if (!currentChapter) return;
        const list = document.getElementById('commentsList');
        list.innerHTML = '<div class="comments-loading">Loading comments...</div>';

        try {
            const snap = await db.collection('comments')
                .where('chapterId', '==', currentChapter.id).get();
            const comments = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

            const countEl = document.getElementById('commentsCount');
            if (countEl) countEl.textContent = comments.length > 0 ? `${comments.length} comment${comments.length !== 1 ? 's' : ''}` : '';

            if (comments.length === 0) {
                list.innerHTML = '<div class="comments-empty">No comments yet — be the first!</div>';
                return;
            }

            list.innerHTML = '';
            comments.forEach(comment => {
                const item  = document.createElement('div');
                item.className = 'comment-item';
                item.id = `comment-${comment.id}`;
                const isOwn = currentUser && currentUser.uid === comment.userId;
                const date  = comment.createdAt
                    ? new Date(comment.createdAt).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '';

                item.innerHTML = `
                    <div class="comment-header">
                        <div class="comment-author">
                            ${comment.userPhoto
                                ? `<img src="${escHtml(comment.userPhoto)}" alt="">`
                                : '<i class="fas fa-user-circle" style="font-size:1.4rem;color:var(--text-dim)"></i>'}
                            <div class="comment-author-info">
                                <span class="comment-name">${escHtml(comment.userName || 'Anonymous')}</span>
                                <span class="comment-date">${date}</span>
                            </div>
                        </div>
                        ${isOwn ? `<button class="comment-delete-btn" onclick="deleteComment('${comment.id}')"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                    <div class="comment-text">${escHtml(comment.text)}</div>`;
                list.appendChild(item);
            });
        } catch (err) {
            list.innerHTML = '<div class="comments-empty">Could not load comments.</div>';
        }
    }

    async function submitComment() {
        if (!currentUser) { showToast('Sign in to comment'); return; }
        const input = document.getElementById('commentInput');
        const text  = input?.value.trim();
        if (!text) { showToast('Write something first!'); return; }
        const btn = document.querySelector('.submit-comment-btn');
        if (btn) btn.disabled = true;
        try {
            await db.collection('comments').add({
                chapterId: currentChapter.id, bookId: currentChapter.bookId,
                userId: currentUser.uid, userName: currentUser.displayName || 'Anonymous',
                userPhoto: currentUser.photoURL || '', text,
                createdAt: new Date().toISOString()
            });
            if (input) input.value = '';
            showToast('Comment posted!');
            loadComments();
        } catch (err) { showToast('Error posting comment'); }
        finally { if (btn) btn.disabled = false; }
    }

    async function deleteComment(commentId) {
        if (!confirm('Delete this comment?')) return;
        try {
            await db.collection('comments').doc(commentId).delete();
            showToast('Comment deleted');
            loadComments();
        } catch (err) { showToast('Error deleting comment'); }
    }

    // ── RENDER ────────────────────────────────────────────
    function renderChapter(chapter, book) {
        document.title = `${chapter.title} — Lusales Archive`;

        document.getElementById('barTitle').innerHTML =
            `<span>${book ? escHtml(book.title) : ''}</span> · ${escHtml(chapter.title)}`;
        document.getElementById('bookLabel').textContent =
            book ? `— ${book.title} —` : '— Lusales Archive —';
        document.getElementById('chapterTitle').textContent = chapter.title;
        document.getElementById('chapterDate').textContent  = formatDate(chapter.date);

        const body = document.getElementById('chapterBody');
        const paragraphs = chapter.content.split('\n').filter(p => p.trim())
            .map(p => `<p>${escHtml(p)}</p>`).join('');
        body.innerHTML = paragraphs || `<p>${escHtml(chapter.content)}</p>`;
        body.style.fontSize = `${fontSize}rem`;

        // Estimated read time — surprise tweak
        const words    = chapter.content.split(/\s+/).length;
        const minutes  = Math.max(1, Math.round(words / 200));
        const readTime = document.getElementById('readTime');
        if (readTime) readTime.textContent = `${minutes} min read`;

        updateNavButtons();
        document.getElementById('readerPage').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function updateNavButtons() {
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        if (currentIndex > 0) {
            prevBtn.classList.remove('disabled');
            document.getElementById('prevTitle').textContent = allBookChapters[currentIndex-1].title;
        } else {
            prevBtn.classList.add('disabled');
            document.getElementById('prevTitle').textContent = '—';
        }
        if (currentIndex < allBookChapters.length-1) {
            nextBtn.classList.remove('disabled');
            document.getElementById('nextTitle').textContent = allBookChapters[currentIndex+1].title;
        } else {
            nextBtn.classList.add('disabled');
            document.getElementById('nextTitle').textContent = '—';
        }
    }

    // ── NAVIGATION ────────────────────────────────────────
    function navigateChapter(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex < 0 || newIndex >= allBookChapters.length) return;
        window.location.href = `reader.html?chapter=${allBookChapters[newIndex].id}`;
    }

    function goBack() {
        if (document.referrer && document.referrer.includes(window.location.hostname)) history.back();
        else window.location.href = 'index.html';
    }

    function changeFontSize(d) {
        fontSize = Math.min(Math.max(fontSize + d * 0.1, 0.9), 1.8);
        const body = document.getElementById('chapterBody');
        if (body) body.style.fontSize = `${fontSize}rem`;
    }

    // ── PROGRESS BAR ──────────────────────────────────────
    function setupProgressBar() {
        const bar = document.getElementById('progressBar');
        window.addEventListener('scroll', () => {
            const docH = document.documentElement.scrollHeight - window.innerHeight;
            bar.style.width = docH > 0 ? `${(window.scrollY / docH) * 100}%` : '0%';
        });
    }

    // ── AUTO HIDE BAR ─────────────────────────────────────
    function setupBarAutoHide() {
        const bar = document.getElementById('readerBar');
        let last  = 0;
        window.addEventListener('scroll', () => {
            const cur = window.scrollY;
            if (!focusMode) {
                if (cur > last && cur > 120) bar.classList.add('hidden');
                else bar.classList.remove('hidden');
            }
            last = cur;
        });
    }

    // ── UTILS ─────────────────────────────────────────────
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    function fadeOutLoader() {
        const l = document.getElementById('loadingScreen');
        l.classList.add('fade-out');
        setTimeout(() => l.style.display = 'none', 500);
    }

    function showError() {
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('errorScreen').style.display   = 'block';
    }

    function escHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        return new Date(dateStr).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
    }

    // Keyboard navigation
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') navigateChapter(1);
        if (e.key === 'ArrowLeft')  navigateChapter(-1);
        if (e.key === 'Escape')     goBack();
        if (e.key === 'f' || e.key === 'F') toggleReadingMode();
    });
</script>
</body>
</html>
